name: Showcase — static security and interactions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: node --check docs/app.js
      - name: Static content, privacy and UX interaction tests
        run: node --test tests/*.test.mjs
